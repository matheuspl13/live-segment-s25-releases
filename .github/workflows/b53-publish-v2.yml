name: Publish verified B53 code49 via in-app V2 updater
on:
  push:
    branches: [work/publish-b53-signed-ota-v2-20261115]
    paths: ['.github/workflows/b53-publish-v2.yml']
permissions:
  contents: write
concurrency:
  group: b53-private-release-ota-v2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Download short-lived private signed B53 artifact and verify immutable identity
        shell: bash
        env:
          ARTIFACT_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-8598-820e-9393-6092cb5c2fbd/raw?se=2026-11-15T05%3A44%3A17Z&sp=r&sv=2026-06-06&sr=b&scid=d83ea4e1-4035-5ed0-83c1-f1ccdcb4b464&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-14T17%3A17%3A50Z&ske=2026-11-15T17%3A17%3A50Z&sks=b&skv=2026-06-06&sig=wnxaHFKEJRfUtzUj%2BM35LkbX2To5rfvBuA/ljXC1XLo%3D"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            -o "$RUNNER_TEMP/b53-source.zip" "$ARTIFACT_URL"
          python3 - <<'PY'
          import os,pathlib,hashlib,zipfile
          p=pathlib.Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(p/'b53-source.zip') as z:
              apks=[a for a in z.namelist() if a.endswith('/app-release.apk')]
              assert len(apks)==1
              data=z.read(apks[0])
          assert len(data)==2650343
          assert hashlib.sha256(data).hexdigest()=='66283997e41102d84e911894c76d42208812ddad796bebb01a4539498fb52951'
          (p/'b53-release.apk').write_bytes(data)
          print('B53_SOURCE_SIGNED_APK_HASH_AND_SIZE_PASS')
          PY
      - name: Verify same B51 Android signing certificate and package code49
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="\${ANDROID_HOME:-\${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -x "$SDK_ROOT/build-tools/36.0.0/apksigner" ]]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0"
          fi
          "$SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/b53-release.apk" > "$RUNNER_TEMP/cert.txt"
          grep -Fq 'Signer #1 certificate SHA-256 digest: a5864a77fbd2e737c56b1918199cff31a09d76c93273ccb67993f4d0a92f96e2' "$RUNNER_TEMP/cert.txt"
          "$SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$RUNNER_TEMP/b53-release.apk" > "$RUNNER_TEMP/package.txt"
          grep -Fq "package: name='com.ciclismo.livesegments.multiroute' versionCode='49' versionName='0.17.22-s25-all-history-diagnostics'" "$RUNNER_TEMP/package.txt"
          echo B53_SIGNATURE_PACKAGE_AND_CODE_PASS
      - name: Stage verified immutable OTA chunks (do NOT advertise yet)
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git pull --ff-only origin main
          python3 - <<'PY'
          import os,pathlib,hashlib,base64,json
          data=(pathlib.Path(os.environ['RUNNER_TEMP'])/'b53-release.apk').read_bytes()
          sha='66283997e41102d84e911894c76d42208812ddad796bebb01a4539498fb52951'
          assert hashlib.sha256(data).hexdigest()==sha and len(data)==2650343
          existing=pathlib.Path('latest-test-s25-v2.json')
          if existing.exists():
              old=json.loads(existing.read_text())
              assert int(old.get('versionCode',0))<49, 'A newer OTA manifest already exists'
          path=pathlib.Path('v0.17.22-s25-all-history-diagnostics')
          path.mkdir(exist_ok=True)
          parts=[data[n:n+300000] for n in range(0,len(data),300000)]
          assert len(parts)==9
          urls=[]
          for index,part in enumerate(parts):
              file=path/f'part{index:02d}.b64'
              content=base64.b64encode(part)
              if file.exists(): assert file.read_bytes()==content
              else: file.write_bytes(content)
              urls.append(f'https://raw.githubusercontent.com/matheuspl13/live-segment-s25-releases/main/{path.name}/{file.name}')
          result=b''.join(base64.b64decode(x.read_bytes(),validate=True) for x in sorted(path.glob('part*.b64')))
          assert result==data
          manifest={'versionCode':49,
              'versionName':'0.17.22-s25-all-history-diagnostics',
              'sha256':sha,'totalBytes':len(data),
              'notes':'B53: Novo botao EXPORTAR TODO O HISTORICO no menu Testes e Diagnostico. Reune logs antigos ainda retidos, arquivos de auditoria, atividades, estados de sessao, pausas, FINISH e notificacoes em ZIP. Nao altera o motor de competicao.',
              'chunks':urls}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'b53-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          print(f'B53_CHUNKS_REASSEMBLED_LOCAL_PASS parts={len(parts)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v0.17.22-s25-all-history-diagnostics/
          if ! git diff --staged --quiet; then
            git commit -m "ota: stage signed B53 code49 payload; manifest not yet updated"
            git push origin HEAD:main
          fi
      - name: Verify the actual public Android chunk URLs before publication
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,hashlib,base64,time,http.client,urllib.parse
          m=json.load(open(os.environ['RUNNER_TEMP']+'/b53-manifest.json'))
          def get(url):
              u=urllib.parse.urlsplit(url)
              assert u.scheme=='https' and u.hostname=='raw.githubusercontent.com'
              c=http.client.HTTPSConnection(u.hostname,timeout=20)
              try:
                  c.request('GET',u.path,headers={'Cache-Control':'no-cache'})
                  resp=c.getresponse()
                  assert resp.status==200, f'Unexpected HTTP {resp.status}'
                  data=resp.read(8*1024*1024+1)
                  assert len(data)<=8*1024*1024
                  return data
              finally: c.close()
          for attempt in range(16):
              try:
                  data=b''.join(base64.b64decode(get(u).strip(),validate=True) for u in m['chunks'])
                  assert len(data)==m['totalBytes'] and hashlib.sha256(data).hexdigest()==m['sha256']
                  print('B53_PUBLIC_RAW_OTA_FULL_APK_RECONSTRUCTION_PASS')
                  break
              except Exception as e:
                  if attempt==15: raise
                  print(f'CDN retry {attempt+1}: {type(e).__name__}',flush=True)
                  time.sleep(5)
          PY
      - name: Publish v2 manifest LAST (do not modify legacy feed)
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git pull --ff-only origin main
          test ! -e latest-test-s25-v2.json
          cp "$RUNNER_TEMP/b53-manifest.json" latest-test-s25-v2.json
          git add latest-test-s25-v2.json
          git commit -m "ota: advertise B53 code49 signed diagnostics on S25 V2 updater"
          git push origin HEAD:main
      - name: Verify public manifest served to the installed in-app updater
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import http.client,json,time
          expected=json.load(open('latest-test-s25-v2.json'))
          path='/matheuspl13/live-segment-s25-releases/main/latest-test-s25-v2.json'
          for attempt in range(16):
              c=http.client.HTTPSConnection('raw.githubusercontent.com',timeout=20)
              try:
                  c.request('GET',path,headers={'Cache-Control':'no-cache'})
                  resp=c.getresponse()
                  if resp.status==200:
                      actual=json.loads(resp.read(256*1024).decode())
                      assert actual==expected
                      print('B53_IN_APP_OTA_FEED_PUBLIC_PASS')
                      break
              finally: c.close()
              if attempt==15: raise RuntimeError('OTA manifest not live')
              time.sleep(5)
          PY
      - name: Remove temporary signing artifact from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/b53-source.zip" "$RUNNER_TEMP/b53-release.apk"
