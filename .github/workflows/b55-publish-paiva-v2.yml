name: Publish verified B55 code51 via in-app V2 updater
on:
  push:
    branches: [work/publish-b55-paiva-finish-durability-ota-v2-20261115]
    paths: ['.github/workflows/b55-publish-paiva-v2.yml']
permissions:
  contents: write
concurrency:
  group: b55-private-release-ota-v2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Download short-lived private signed B55 artifact and verify immutable identity
        shell: bash
        env:
          ARTIFACT_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-6cf4-820e-b907-384d785a7c56/raw?se=2026-11-15T07%3A18%3A40Z&sp=r&sv=2026-06-06&sr=b&scid=0b4988ab-4f10-54e1-a3c2-ad6c99dc09ea&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-14T18%3A24%3A52Z&ske=2026-11-15T18%3A24%3A52Z&sks=b&skv=2026-06-06&sig=9yrRbqYIJV3ZSTnXf6V0Wi3PihDe8DXU4mXlx1vbyL8%3D"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            -o "$RUNNER_TEMP/b55-source.zip" "$ARTIFACT_URL"
          python3 - <<'PY'
          import os,pathlib,hashlib,zipfile
          p=pathlib.Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(p/'b55-source.zip') as z:
              apks=[a for a in z.namelist() if a.endswith('/app-release.apk')]
              assert len(apks)==1
              data=z.read(apks[0])
          assert len(data)==2655731
          assert hashlib.sha256(data).hexdigest()=='90a1cfb706bf2ae22518472e62787b6cd8c6225652391138da093fd7d0b6da4c'
          (p/'b55-release.apk').write_bytes(data)
          print('B55_SOURCE_SIGNED_APK_HASH_AND_SIZE_PASS')
          PY
      - name: Verify same B51 Android signing certificate and package code51
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -x "$SDK_ROOT/build-tools/36.0.0/apksigner" ]]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0"
          fi
          "$SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/b55-release.apk" > "$RUNNER_TEMP/cert.txt"
          grep -Fq 'Signer #1 certificate SHA-256 digest: a5864a77fbd2e737c56b1918199cff31a09d76c93273ccb67993f4d0a92f96e2' "$RUNNER_TEMP/cert.txt"
          "$SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$RUNNER_TEMP/b55-release.apk" > "$RUNNER_TEMP/package.txt"
          grep -Fq "package: name='com.ciclismo.livesegments.multiroute' versionCode='51' versionName='0.17.24-s25-paiva-finish-durability'" "$RUNNER_TEMP/package.txt"
          echo B55_SIGNATURE_PACKAGE_AND_CODE_PASS
      - name: Stage verified immutable OTA chunks (do NOT advertise yet)
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git pull --ff-only origin main
          python3 - <<'PY'
          import os,pathlib,hashlib,base64,json
          data=(pathlib.Path(os.environ['RUNNER_TEMP'])/'b55-release.apk').read_bytes()
          sha='49129f615570638e9e4cdf604750aabecc3748b60ebb5e097e9b97545c5aefa0'
          assert hashlib.sha256(data).hexdigest()==sha and len(data)==2655731
          existing=pathlib.Path('latest-test-s25-v2.json')
          assert existing.exists(), 'Expected B54 OTA manifest before B55 update'
          old=json.loads(existing.read_text())
          assert int(old.get('versionCode',0))==50
          assert old.get('sha256')=='49129f615570638e9e4cdf604750aabecc3748b60ebb5e097e9b97545c5aefa0'
          path=pathlib.Path('v0.17.24-s25-paiva-finish-durability')
          path.mkdir(exist_ok=True)
          parts=[data[n:n+300000] for n in range(0,len(data),300000)]
          assert len(parts)==9
          urls=[]
          for index,part in enumerate(parts):
              file=path/f'part{index:02d}.b64'
              content=base64.b64encode(part)
              if file.exists(): assert file.read_bytes()==content
              else: file.write_bytes(content)
              urls.append(f'https://raw.githubusercontent.com/matheuspl13/live-segment-s25-releases/main/{path.name}/{file.name}')
          result=b''.join(base64.b64decode(x.read_bytes(),validate=True) for x in sorted(path.glob('part*.b64')))
          assert result==data
          manifest={'versionCode':51,
              'versionName':'0.17.24-s25-paiva-finish-durability',
              'sha256':sha,'totalBytes':len(data),
              'notes':'B55: Corrige quatro avisos de FINISH apos desvio confirmado pelo BSC200; mantem o servico ativo ate terminar os avisos. Salva FINISH fisico sem ranking antes de limpar a sessao, recupera apos reinicio Android e evita encerramento de ciclismo em movimento. Preserva gates Python/FIT, Top 10, pausas, tempos e exportacao completa de logs.',
              'chunks':urls}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'b55-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          print(f'B55_CHUNKS_REASSEMBLED_LOCAL_PASS parts={len(parts)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v0.17.24-s25-paiva-finish-durability/
          if ! git diff --staged --quiet; then
            git commit -m "ota: stage signed B55 code51 payload; manifest not yet updated"
            git push origin HEAD:main
          fi
      - name: Verify the actual public Android chunk URLs before publication
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,hashlib,base64,time,http.client,urllib.parse
          m=json.load(open(os.environ['RUNNER_TEMP']+'/b55-manifest.json'))
          def get(url):
              u=urllib.parse.urlsplit(url)
              assert u.scheme=='https' and u.hostname=='raw.githubusercontent.com'
              c=http.client.HTTPSConnection(u.hostname,timeout=20)
              try:
                  c.request('GET',u.path,headers={'Cache-Control':'no-cache'})
                  resp=c.getresponse()
                  assert resp.status==200, f'Unexpected HTTP {resp.status}'
                  data=resp.read(8*1024*1024+1)
                  assert len(data)<=8*1024*1024
                  return data
              finally: c.close()
          for attempt in range(16):
              try:
                  data=b''.join(base64.b64decode(get(u).strip(),validate=True) for u in m['chunks'])
                  assert len(data)==m['totalBytes'] and hashlib.sha256(data).hexdigest()==m['sha256']
                  print('B55_PUBLIC_RAW_OTA_FULL_APK_RECONSTRUCTION_PASS')
                  break
              except Exception as e:
                  if attempt==15: raise
                  print(f'CDN retry {attempt+1}: {type(e).__name__}',flush=True)
                  time.sleep(5)
          PY
      - name: Publish v2 manifest LAST (do not modify legacy feed)
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git pull --ff-only origin main
          python3 - <<'PY'
          import json
          old=json.load(open('latest-test-s25-v2.json'))
          assert old['versionCode']==50
          assert old['sha256']=='49129f615570638e9e4cdf604750aabecc3748b60ebb5e097e9b97545c5aefa0'
          PY
          cp "$RUNNER_TEMP/b55-manifest.json" latest-test-s25-v2.json
          git add latest-test-s25-v2.json
          git commit -m "ota: advertise B55 code51 signed diagnostics on S25 V2 updater"
          git push origin HEAD:main
      - name: Verify public manifest served to the installed in-app updater
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import http.client,json,time
          expected=json.load(open('latest-test-s25-v2.json'))
          path='/matheuspl13/live-segment-s25-releases/main/latest-test-s25-v2.json'
          for attempt in range(16):
              c=http.client.HTTPSConnection('raw.githubusercontent.com',timeout=20)
              try:
                  c.request('GET',path,headers={'Cache-Control':'no-cache'})
                  resp=c.getresponse()
                  if resp.status==200:
                      actual=json.loads(resp.read(256*1024).decode())
                      if actual==expected:
                          print('B55_IN_APP_OTA_FEED_PUBLIC_PASS')
                          break
              finally: c.close()
              if attempt==15: raise RuntimeError('OTA manifest not live')
              time.sleep(5)
          PY
      - name: Remove temporary signing artifact from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/b55-source.zip" "$RUNNER_TEMP/b55-release.apk"
